<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>বিলাসবহুল গাড়ি ৩ডি</title>
<style>
:root{--bg:#eceff3;--fg:#14213d;--acc:#b8892f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1118;--fg:#e8ecf2;--acc:#d9b25c}}
:root[data-theme="dark"]{--bg:#0d1118;--fg:#e8ecf2;--acc:#d9b25c}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;overflow:hidden;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
h1{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:16px;margin:0;font-size:18px;font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
button{font:inherit;font-size:15px;color:var(--fg);background:transparent;border:1.5px solid var(--fg);border-radius:12px;padding:12px 4px;cursor:pointer}
button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#111}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<h1>বিলাসবহুল সেডান</h1>
<div class="bar">
<button id="bh" type="button" aria-pressed="false">বনেট</button>
<button id="bd" type="button" aria-pressed="false">দরজা</button>
<button id="be" type="button" aria-pressed="false">ইঞ্জিন</button>
<button id="bx" type="button" aria-pressed="false">এক্স-রে</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var cv=document.getElementById('c');
var r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
r.setPixelRatio(Math.min(devicePixelRatio,2));
var s=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,0.1,100);
s.add(new THREE.HemisphereLight(0xffffff,0x334455,0.95));
var dl=new THREE.DirectionalLight(0xffffff,1.1);dl.position.set(4,7,5);s.add(dl);
var pl=new THREE.PointLight(0xffd9a0,0.8,14);pl.position.set(-3,3,-3);s.add(pl);
function M(c,m,ro,x){var o={color:c,metalness:m,roughness:ro};if(x)for(var k in x)o[k]=x[k];return new THREE.MeshStandardMaterial(o);}
var mB=M(0x0e8a62,0.5,0.25),mC=M(0xe3e7ec,0.7,0.2),mG=M(0xc9a24b,0.7,0.3),mD=M(0x15171b,0.3,0.6),
mGl=M(0x7d9bb8,0.1,0.1,{transparent:true,opacity:0.3}),mS=M(0xb88a5a,0.1,0.7),mT=M(0x0c0c0d,0,0.9),
mCov=M(0xe3e7ec,0.7,0.2,{emissive:0xff4422,emissiveIntensity:0}),
mGw=M(0xffc46b,0,0.4,{emissive:0xffa733,emissiveIntensity:0.9}),
mL=M(0xffffff,0,0.3,{emissive:0xfff2cc,emissiveIntensity:1}),mTl=M(0xaa1020,0,0.4,{emissive:0xff1a33,emissiveIntensity:0.8}),
mR=M(0xcc1122,0,0.5);
var car=new THREE.Group();s.add(car);
function box(w,h,d,m,x,y,z,p){var o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);(p||car).add(o);return o;}
function cyl(rt,h,m,x,y,z,p,seg){var o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rt,h,seg||24),m);o.position.set(x,y,z);(p||car).add(o);return o;}
/* body */
box(3.35,0.55,1.9,mB,-0.825,0.75,0);
box(1.65,0.1,1.3,mD,1.675,0.52,0);
[1,-1].forEach(function(z){box(1.65,0.55,0.3,mB,1.675,0.75,z*0.8);});
box(0.08,0.62,0.75,mC,2.5,0.8,0);
for(var i=0;i<9;i++)box(0.03,0.54,0.025,mD,2.55,0.8,-0.32+i*0.08);
box(0.12,0.12,1.9,mC,2.52,0.5,0);box(0.12,0.12,1.9,mC,-2.52,0.5,0);
box(2.5,0.52,1.62,mGl,-0.75,1.3,0);
[[0.5,0.8],[0.5,-0.8],[-2,0.8],[-2,-0.8]].forEach(function(p){box(0.08,0.55,0.08,mB,p[0],1.3,p[1]);});
var roof=box(2.7,0.07,1.75,mB,-0.75,1.6,0);
[1,-1].forEach(function(z){
 sphere(2.5,0.95,z*0.62);box(0.05,0.12,0.4,mTl,-2.52,0.9,z*0.7);
});
function sphere(x,y,z){var o=new THREE.Mesh(new THREE.SphereGeometry(0.1,16,16),mL);o.position.set(x,y,z);car.add(o);}
/* hood */
var hood=new THREE.Group();hood.position.set(0.85,1.03,0);car.add(hood);
box(1.62,0.09,1.9,mB,0.81,0.045,0,hood);
var orn=new THREE.Mesh(new THREE.ConeGeometry(0.04,0.14,12),mC);orn.position.set(1.55,0.16,0);hood.add(orn);
/* doors */
var doors=[1,-1].map(function(z){
 var g=new THREE.Group();g.position.set(0.4,0.78,z*0.96);car.add(g);
 box(1.2,0.5,0.05,mB,-0.6,0,0,g);box(0.12,0.03,0.03,mC,-1.0,0.12,z*0.04,g);return g;});
/* interior */
[-0.35,-1.3].forEach(function(x){[0.42,-0.42].forEach(function(z){
 box(0.55,0.18,0.55,mS,x,1.12,z);box(0.1,0.5,0.55,mS,x-0.28,1.4,z);box(0.08,0.14,0.2,mS,x-0.28,1.72,z);});});
box(0.3,0.22,1.55,mD,0.35,1.2,0);
var sw=new THREE.Mesh(new THREE.TorusGeometry(0.17,0.022,10,32),mD);sw.position.set(0.02,1.3,0.42);sw.rotation.y=Math.PI/2;car.add(sw);
[0.3,0.55].forEach(function(dz){var o=cyl(0.07,0.02,mGw,0.2,1.3,dz-0.12);o.rotation.z=Math.PI/2;});
box(0.02,0.14,0.3,mGw,0.2,1.25,-0.1);
box(0.6,0.12,0.2,mD,-0.5,1.1,0);cyl(0.02,0.18,mC,-0.3,1.2,0);
/* engine */
var eng=new THREE.Group();eng.position.set(1.55,0,0);car.add(eng);
box(0.9,0.28,0.5,mD,0,0.74,0,eng);
[1,-1].forEach(function(z){box(0.9,0.1,0.18,mC,0,0.88,z*0.17,eng);
 for(var i=0;i<6;i++)cyl(0.045,0.08,mCov,-0.38+i*0.152,0.93,z*0.17,eng);});
box(0.7,0.05,0.12,mG,0,0.95,0,eng);
box(0.3,0.2,0.18,mD,-0.55,0.75,-0.5,eng);cyl(0.02,0.04,mR,-0.62,0.88,-0.5,eng);cyl(0.02,0.04,mC,-0.48,0.88,-0.5,eng);
box(0.06,0.5,0.6,mD,0.7,0.8,0,eng);
var fan=new THREE.Group();fan.position.set(0.6,0.8,0);eng.add(fan);
for(var j=0;j<5;j++){var bg=new THREE.Group();bg.rotation.x=j*Math.PI*2/5;fan.add(bg);box(0.02,0.17,0.07,mC,0,0.1,0,bg);}
var hub=cyl(0.03,0.04,mG,0,0,0,fan);hub.rotation.z=Math.PI/2;
/* wheels */
var wheels=[];
[[1.55,1],[1.55,-1],[-1.55,1],[-1.55,-1]].forEach(function(p){
 var w=new THREE.Group();w.position.set(p[0],0.38,p[1]*0.98);car.add(w);
 var t=cyl(0.38,0.28,mT,0,0,0,w,32);t.rotation.x=Math.PI/2;
 var rm=cyl(0.27,0.3,mC,0,0,0,w,32);rm.rotation.x=Math.PI/2;
 var cp=cyl(0.08,0.32,mG,0,0,0,w);cp.rotation.x=Math.PI/2;
 for(var k=0;k<5;k++){var sp=box(0.05,0.5,0.05,mD,0,0,p[1]*0.15,w);sp.rotation.z=k*Math.PI/5;}
 wheels.push(w);});
/* floor */
var fl=new THREE.Mesh(new THREE.CircleGeometry(5,64),M(0x20242b,0.2,0.8));fl.rotation.x=-Math.PI/2;s.add(fl);
var rg=new THREE.Mesh(new THREE.RingGeometry(4.6,4.68,64),mG);rg.rotation.x=-Math.PI/2;rg.position.y=0.01;s.add(rg);
/* camera orbit */
var th=0.9,ph=1.15,rad=8.5,dragging=false,ptr={},lastT=0;
function place(){cam.position.set(rad*Math.sin(ph)*Math.sin(th),0.8+rad*Math.cos(ph),rad*Math.sin(ph)*Math.cos(th));cam.lookAt(0,0.9,0);}
function size(){var w=innerWidth,h=innerHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();rad=w<h?11:8;place();}
addEventListener('resize',size);size();
cv.addEventListener('pointerdown',function(e){ptr[e.pointerId]=[e.clientX,e.clientY];dragging=true;});
addEventListener('pointerup',function(e){delete ptr[e.pointerId];dragging=Object.keys(ptr).length>0;lastT=performance.now();});
addEventListener('pointermove',function(e){
 var p=ptr[e.pointerId];if(!p)return;var ids=Object.keys(ptr);
 if(ids.length>1){var o=ptr[ids[0]==e.pointerId?ids[1]:ids[0]];var d0=Math.hypot(p[0]-o[0],p[1]-o[1]);var d1=Math.hypot(e.clientX-o[0],e.clientY-o[1]);rad=Math.max(5,Math.min(16,rad*d0/d1));}
 else{th-=(e.clientX-p[0])*0.008;ph=Math.max(0.25,Math.min(1.5,ph-(e.clientY-p[1])*0.006));}
 p[0]=e.clientX;p[1]=e.clientY;place();});
cv.addEventListener('wheel',function(e){rad=Math.max(5,Math.min(16,rad+e.deltaY*0.01));place();},{passive:true});
/* controls */
var st={h:false,d:false,e:false,x:false};
function tg(id,k){var b=document.getElementById(id);b.addEventListener('click',function(){st[k]=!st[k];b.setAttribute('aria-pressed',st[k]);if(k==='x')xray();});}
tg('bh','h');tg('bd','d');tg('be','e');tg('bx','x');
function xray(){[mB,mGl].forEach(function(m){m.transparent=true;m.opacity=st.x?(m===mGl?0.08:0.12):(m===mGl?0.3:1);m.depthWrite=!st.x;m.needsUpdate=true;});}
var still=matchMedia('(prefers-reduced-motion: reduce)').matches;
var clk=new THREE.Clock();
function loop(){
 var t=clk.getElapsedTime();
 hood.rotation.z+=((st.h?1.1:0)-hood.rotation.z)*0.07;
 doors[0].rotation.y+=((st.d?1.0:0)-doors[0].rotation.y)*0.07;
 doors[1].rotation.y+=((st.d?-1.0:0)-doors[1].rotation.y)*0.07;
 if(st.e){fan.rotation.x+=0.45;eng.position.y=0.004*Math.sin(t*70);mCov.emissiveIntensity=0.35+0.3*Math.sin(t*8);wheels.forEach(function(w){w.rotation.z-=0.06;});}
 else{eng.position.y=0;mCov.emissiveIntensity=0;}
 if(!still&&!dragging&&performance.now()-lastT>3000){th+=0.003;place();}
 r.render(s,cam);requestAnimationFrame(loop);}
loop();
})();
</script>
</body>
</html>
